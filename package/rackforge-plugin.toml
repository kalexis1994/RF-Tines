schema_version = 3
id = "org.rackforge.rftines"
name = "RF-Tines"
short_name = "RF-Tines"
vendor = "RackForge"
version = "0.2.7"
description = "Physical-model electric piano with responsive hammer, tine, tonebar and magnetic-pickup voicing"
kind = "instrument"
state_version = 6
capabilities = ["audio_output", "midi_input", "presets", "state"]
ui_layouts = ["little@1"]
config_mode = true

[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#181818"
accent_color = "#B86F3D"

[api]
major = 1
minor = 11

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[[web_ui.surfaces]]
kind = "config"
entry = "web/config.html"
